<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charge batterie - AC vs Tension</title>
<style>
  :root { --bg:#ffffff; --fg:#2b2a27; --muted:#898781; --grid:#e1e0d9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1e1e1e; --fg:#e8e6e1; --muted:#a3a19c; --grid:#3a3a3a; }
  }
  :root[data-theme="dark"] { --bg:#1e1e1e; --fg:#e8e6e1; --muted:#a3a19c; --grid:#3a3a3a; }
  html,body { height:100%; margin:0; box-sizing:border-box; }
  body { max-width:832px; margin:0 auto; } /* 800 px de contenu + 2×16 px de marge, centré */
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,sans-serif;
         padding: max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px)); }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
  p.sub { font-size:12px; color:var(--muted); margin:0 0 16px; }
  .wrap { position:relative; width:100%; max-width:800px; max-height:486px; aspect-ratio:800 / 486; margin:0 auto; } /* taille maximale 800 × 486 px */
  .legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font-size:12px; color:var(--muted); }
  .legend span { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:2px; display:inline-block; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:12px; max-height:300px; overflow-y:auto; display:block; }
  table[hidden] { display:none; }
  th,td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; }
</style>
</head>
<body>
<h1>Charge d'une batterie 48V 14Ah avec un chargeur 3A</h1>
<p class="sub">17:02:39 → 22:01:12 · Échelle de gauche = courant (0-3A) · Échelle droite = tension (44-55V)</p>
<div class="wrap"><canvas id="chart"></canvas>
</div>
<div class="legend">
  <span><span class="dot" style="background:#2a78d6"></span>AC mesuré (A, échelle gauche)</span>
  <span><span class="dot" style="background:#e34948"></span>DC (A, échelle gauche)</span>
  <span><span class="dot" style="background:#008300"></span>Tension (V, échelle droite)</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ["17:02:39", "17:04:38", "17:06:38", "17:08:39", "17:10:38", "17:12:38", "17:14:39", "17:16:39", "17:18:39", "17:20:38", "17:22:39", "17:24:38", "17:26:39", "17:28:39", "17:30:38", "17:32:39", "17:34:39", "17:36:39", "17:38:38", "17:40:39", "17:42:39", "17:44:39", "17:46:39", "17:48:38", "17:50:39", "17:52:39", "17:54:39", "17:56:39", "17:58:39", "18:00:39", "18:02:39", "18:04:39", "18:06:38", "18:08:39", "18:10:38", "18:12:38", "18:14:39", "18:16:39", "18:18:39", "18:20:39", "18:22:39", "18:24:38", "18:26:38", "18:28:39", "18:30:39", "18:32:39", "18:34:38", "18:36:39", "18:38:39", "18:40:39", "18:42:38", "18:44:38", "18:46:39", "18:48:39", "18:50:39", "18:52:39", "18:54:39", "18:56:38", "18:58:39", "19:00:39", "19:02:38", "19:04:39", "19:06:39", "19:08:38", "19:10:39", "19:12:39", "19:14:38", "19:16:39", "19:18:38", "19:20:38", "19:22:39", "19:24:39", "19:26:39", "19:28:38", "19:30:39", "19:32:38", "19:34:39", "19:36:39", "19:38:39", "19:40:39", "19:42:38", "19:44:38", "19:46:39", "19:48:39", "19:50:38", "19:52:39", "19:54:38", "19:56:39", "19:58:39", "20:00:39", "20:02:38", "20:04:39", "20:06:39", "20:08:38", "20:10:39", "20:12:39", "20:14:39", "20:16:38", "20:18:38", "20:20:39", "20:22:38", "20:24:39", "20:26:38", "20:28:39", "20:30:39", "20:32:38", "20:34:39", "20:36:39", "20:38:39", "20:40:39", "20:42:39", "20:44:39", "20:46:39", "20:48:39", "20:50:39", "20:52:38", "20:54:39", "20:56:38", "20:58:39", "21:00:39", "21:02:39", "21:04:39", "21:06:38", "21:08:39", "21:10:39", "21:12:38", "21:14:39", "21:16:38", "21:18:39", "21:20:39", "21:22:39", "21:24:39", "21:26:39", "21:28:39", "21:30:39", "21:32:39", "21:34:38", "21:36:39", "21:38:39", "21:40:38", "21:42:39", "21:44:39", "21:46:38", "21:48:39", "21:50:39", "21:52:38", "21:54:38", "21:56:39", "21:58:39", "22:00:38", "22:01:12"];
const iAc = [1.16, 1.17, 1.17, 1.17, 1.17, 1.18, 1.18, 1.18, 1.19, 1.19, 1.19, 1.2, 1.2, 1.2, 1.2, 1.2, 1.21, 1.21, 1.21, 1.21, 1.21, 1.21, 1.21, 1.21, 1.21, 1.21, 1.22, 1.22, 1.22, 1.22, 1.22, 1.22, 1.22, 1.22, 1.22, 1.22, 1.23, 1.23, 1.23, 1.23, 1.23, 1.23, 1.23, 1.23, 1.23, 1.24, 1.24, 1.24, 1.24, 1.24, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.26, 1.26, 1.26, 1.26, 1.26, 1.26, 1.26, 1.27, 1.27, 1.27, 1.27, 1.27, 1.27, 1.27, 1.27, 1.28, 1.28, 1.28, 1.28, 1.28, 1.28, 1.29, 1.29, 1.29, 1.3, 1.3, 1.3, 1.31, 1.31, 1.31, 1.31, 1.31, 1.31, 1.26, 1.22, 1.19, 1.16, 1.14, 1.12, 1.1, 1.08, 1.06, 1.04, 1.03, 1.02, 1.0, 0.99, 0.97, 0.95, 0.92, 0.91, 0.9, 0.88, 0.86, 0.84, 0.82, 0.8, 0.77, 0.76, 0.74, 0.71, 0.68, 0.65, 0.64, 0.61, 0.59, 0.57, 0.54, 0.51, 0.5, 0.47, 0.44, 0.41, 0.4, 0.37, 0.35, 0.32, 0.29, 0.26, 0.25, 0.22, 0.21, 0.18, 0.16, 0.13, 0.11, 0.09, 0.07, 0.0, 0.0, 0.0];
const vNew = [45.9, 45.9, 45.91, 45.92, 45.94, 45.96, 45.98, 46.01, 46.04, 46.08, 46.12, 46.16, 46.21, 46.26, 46.32, 46.38, 46.44, 46.5, 46.57, 46.64, 46.72, 46.79, 46.87, 46.95, 47.04, 47.12, 47.21, 47.3, 47.4, 47.49, 47.59, 47.69, 47.78, 47.89, 47.99, 48.09, 48.2, 48.3, 48.41, 48.52, 48.63, 48.73, 48.84, 48.96, 49.07, 49.18, 49.29, 49.4, 49.51, 49.63, 49.74, 49.85, 49.96, 50.07, 50.18, 50.29, 50.4, 50.51, 50.62, 50.72, 50.83, 50.93, 51.04, 51.14, 51.24, 51.34, 51.44, 51.53, 51.63, 51.72, 51.81, 51.9, 51.98, 52.07, 52.15, 52.23, 52.31, 52.38, 52.45, 52.52, 52.59, 52.65, 52.71, 52.77, 52.82, 52.87, 52.92, 52.97, 53.01, 53.04, 53.08, 53.11, 53.13, 53.15, 53.17, 53.18, 53.19, 53.2, 53.2, 53.21, 53.23, 53.26, 53.31, 53.35, 53.4, 53.45, 53.5, 53.54, 53.57, 53.59, 53.6, 53.6, 53.61, 53.63, 53.65, 53.67, 53.7, 53.72, 53.74, 53.76, 53.78, 53.79, 53.8, 53.8, 53.8, 53.82, 53.83, 53.86, 53.88, 53.91, 53.93, 53.96, 53.98, 54.0, 54.02, 54.04, 54.05, 54.06, 54.07, 54.08, 54.09, 54.09, 54.1, 54.1, 54.1, 54.1, 54.1, 54.1, 54.1, 54.1, 54.1];
const iDc = [2.774, 2.794, 2.789, 2.785, 2.78, 2.799, 2.795, 2.79, 2.81, 2.805, 2.801, 2.82, 2.815, 2.811, 2.806, 2.802, 2.821, 2.816, 2.812, 2.807, 2.803, 2.799, 2.794, 2.79, 2.785, 2.781, 2.8, 2.795, 2.791, 2.787, 2.782, 2.778, 2.774, 2.77, 2.765, 2.761, 2.779, 2.775, 2.771, 2.767, 2.763, 2.758, 2.754, 2.75, 2.746, 2.764, 2.76, 2.756, 2.752, 2.747, 2.765, 2.761, 2.757, 2.753, 2.749, 2.745, 2.741, 2.737, 2.733, 2.729, 2.746, 2.742, 2.738, 2.734, 2.73, 2.726, 2.722, 2.74, 2.736, 2.732, 2.728, 2.724, 2.72, 2.716, 2.712, 2.73, 2.726, 2.722, 2.718, 2.714, 2.71, 2.727, 2.723, 2.719, 2.737, 2.733, 2.729, 2.746, 2.742, 2.738, 2.734, 2.73, 2.727, 2.619, 2.532, 2.466, 2.401, 2.356, 2.312, 2.269, 2.226, 2.183, 2.141, 2.119, 2.097, 2.055, 2.033, 1.991, 1.948, 1.886, 1.864, 1.843, 1.801, 1.76, 1.718, 1.677, 1.636, 1.574, 1.553, 1.512, 1.45, 1.388, 1.327, 1.306, 1.244, 1.203, 1.162, 1.101, 1.039, 1.019, 0.957, 0.896, 0.835, 0.814, 0.753, 0.712, 0.651, 0.59, 0.529, 0.508, 0.447, 0.427, 0.366, 0.325, 0.264, 0.223, 0.183, 0.142, 0.0, 0.0, 0.0];

// --- Correction selon la méthodologie ---
// 1) Tension strictement croissante (jamais de palier ni de redescente)
for (let i = 1; i < vNew.length; i++) {
  if (vNew[i] <= vNew[i-1]) vNew[i] = +(vNew[i-1] + 0.003).toFixed(3);
}
// 2) Courant DC : plat pendant la phase CC jusqu'au pic du courant mesuré,
//    puis I_DC = P * (I_AC / I_pic) * (V_pic / V(t)), toujours <= 3 A
// 3) Arrondi de la pointe du courant AC (≈ 20:04 → 20:08) : moyenne mobile sur 7 points
//    appliquée uniquement sur la zone du coin (20:02:38 → 20:14:39)
const iMax = Math.max(...iAc);
const rStart = labels.indexOf('20:02:38');
const rEnd = labels.indexOf('20:14:39');
const orig = iAc.slice();
for (let i = rStart; i <= rEnd; i++) {
  let s = 0; for (let k = -3; k <= 3; k++) s += orig[i + k];
  iAc[i] = +(s / 7).toFixed(3);
}
// 4) Courant DC simulé, cohérent avec la physique d'un chargeur CC/CV :
//    - Phase CC (jusqu'au début de l'arrondi) : le chargeur régule un courant DC constant.
//      Son niveau est fixé par le bilan de puissance à la fin de la phase CC,
//      P = η · V_AC · I_AC / V_batt, avec η = 0,92 (rendement typique d'un chargeur).
//    - Ensuite (fin de CC puis phase CV) : I_DC = η · V_AC · I_AC / V_batt, donc il suit
//      la forme arrondie du courant AC mesuré. Toujours <= P <= 3 A.
const V_AC = 120.1, eta = 0.92;
const ref = rStart - 1;
const P = eta * V_AC * iAc[ref] / vNew[ref];
for (let i = 0; i < iDc.length; i++) {
  iDc[i] = i <= ref ? +P.toFixed(3) : +Math.min(P, eta * V_AC * iAc[i] / vNew[i]).toFixed(3);
}

const SOC = {44:32, 46:45, 48:58, 50:71, 52:84, 54:96, 55:100};
const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
const socLabels = {
  id: 'socLabels',
  afterDraw(chart) {
    const axis = chart.scales.yV, c = chart.ctx;
    c.save();
    c.font = Chart.helpers.toFont(axis.options.ticks.font).string;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    const x = axis.left + axis.options.ticks.padding;
    axis.ticks.forEach(t => {
      const y = axis.getPixelForValue(t.value);
      const v = t.value + 'V ';
      c.fillStyle = '#898781'; c.fillText(v, x, y);
      c.fillStyle = dark ? '#3fb950' : '#008300';
      c.fillText('(' + SOC[t.value] + '%)', x + c.measureText(v).width, y);
    });
    c.restore();
  }
};
// Pourcentage de charge par interpolation linéaire entre les repères tension ↔ % de l'échelle de droite
const SOC_PTS = Object.keys(SOC).map(Number).sort((a, b) => a - b);
function socFromV(v) {
  if (v <= SOC_PTS[0]) return SOC[SOC_PTS[0]];
  for (let k = 1; k < SOC_PTS.length; k++) {
    const a = SOC_PTS[k - 1], b = SOC_PTS[k];
    if (v <= b) return SOC[a] + (SOC[b] - SOC[a]) * (v - a) / (b - a);
  }
  return 100;
}
const soc = vNew.map(socFromV);
// Temps restant : jusqu'à la fin de charge (premier instant où le courant AC tombe à 0)
const toSec = (t) => { const [h, m, x] = t.split(':').map(Number); return h * 3600 + m * 60 + x; };
const endIdx = iAc.findIndex((v, i) => v === 0 && i > iAc.indexOf(Math.max(...iAc)));
const endSec = toSec(labels[endIdx]);
const vEnd = (Math.round(vNew[endIdx] * 10) / 10).toFixed(2).replace('.', ',');   // tension de fin de charge (≈ 54,10 V)
const pad2 = (n) => String(n).padStart(2, '0');
function remaining(i) {
  let d = endSec - toSec(labels[i]);
  if (d < 0 && d > -12 * 3600) d = 0;          // charge terminée
  d = Math.max(0, d);
  return pad2(Math.floor(d / 3600)) + ':' + pad2(Math.floor(d % 3600 / 60)) + ':' + pad2(d % 60);
}
const remainingText = (i) => 'Temps restant → ' + vEnd + 'V: ' + remaining(i);
const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  plugins: [socLabels],
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      { label: 'AC(A)', data: iAc, borderColor: '#2a78d6', backgroundColor: '#2a78d6',
        yAxisID: 'yA', pointRadius: 0, borderWidth: 2, tension: 0 },
      { label: 'DC(A)', data: iDc, borderColor: '#e34948', backgroundColor: '#e34948',
        yAxisID: 'yA', pointRadius: 0, borderWidth: 2, tension: 0 },
      { label: 'Tension (V)', data: vNew, borderColor: '#008300', backgroundColor: '#008300',
        yAxisID: 'yV', pointRadius: 0, borderWidth: 2.5, tension: 0 },
      // Série invisible : sert uniquement à afficher le pourcentage dans l'infobulle
      { label: 'Pourcentage', data: soc, borderColor: 'rgba(0,0,0,0)', backgroundColor: '#3fb950',
        yAxisID: 'yP', pointRadius: 0, borderWidth: 0, showLine: false }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: {
      // Largeur fixe : le titre est complété d'espaces insécables pour que l'infobulle
      // ait toujours la largeur de sa plus longue ligne possible
      title: (items) => {
        const ch = items[0].chart, tt = ch.tooltip, c = ch.ctx;
        if (ch._tipW === undefined) {
          c.save();
          c.font = Chart.helpers.toFont(tt.options.bodyFont).string;
          let w = 0;
          ch.data.datasets.forEach(ds => ds.data.forEach(v => {
            const t = ds.label === 'Pourcentage'
              ? 'Pourcentage: ' + v.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %'
              : ds.label + ': ' + v.toLocaleString('fr-FR', { maximumFractionDigits: 3 });
            w = Math.max(w, c.measureText(t).width);
          }));
          ch._tipW = Math.max(w + tt.options.bodyFont.size + 8, c.measureText(remainingText(0)).width + 4);   // + pastille de couleur et marge
          c.restore();
        }
        c.save();
        c.font = Chart.helpers.toFont(tt.options.titleFont).string;
        let t = items[0].label;
        while (c.measureText(t).width < ch._tipW) t += '\u00A0';
        c.restore();
        return t;
      },
      afterBody: (items) => remainingText(items[0].dataIndex),
      label: (c) => c.dataset.label === 'Pourcentage'
        ? 'Pourcentage: ' + c.parsed.y.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %'
        : c.dataset.label + ': ' + c.formattedValue
    } } },
    scales: {
      x: { ticks: { maxTicksLimit: 10, color: '#898781' }, grid: { display: false } },
      yA: { type: 'linear', position: 'left', min: 0, max: 3,
            title: { display: true, text: 'Courant (A)' }, grid: { color: '#e1e0d9' } },
      yP: { type: 'linear', display: false, min: 0, max: 100 },
      yV: { type: 'linear', position: 'right', min: 44, max: 55,
            afterBuildTicks: (axis) => { axis.ticks = [44, 46, 48, 50, 52, 54, 55].map(v => ({ value: v })); },
            // Texte réel dessiné par le plugin ci-dessous (2 couleurs) ; ici transparent, il sert à réserver la place
            ticks: { padding: 6, color: 'rgba(0,0,0,0)', callback: (v) => v + 'V (' + SOC[v] + '%)' },
            title: { display: true, text: 'Tension (V)' }, grid: { display: false, drawTicks: false } }
    }
  }
});
</script>

<label style="display:flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;cursor:pointer;">
  <input type="checkbox" id="toggleTbl" style="width:16px;height:16px;margin:0;cursor:pointer;">
  Table de vérification (échantillon toutes les 5 lignes)
</label>
<table id="tbl" hidden><thead><tr><th>Heure</th><th>I AC (A)</th><th>I DC (A)</th><th>Tension (V)</th></tr></thead><tbody></tbody></table>
<script>
  const tbl = document.getElementById('tbl');
  document.getElementById('toggleTbl').addEventListener('change', e => { tbl.hidden = !e.target.checked; });
  const tbody = document.querySelector('#tbl tbody');
  for (let i=0; i<labels.length; i+=5) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${labels[i]}</td><td>${iAc[i].toFixed(2)}</td><td>${iDc[i].toFixed(2)}</td><td>${vNew[i].toFixed(2)}</td>`;
    tbody.appendChild(tr);
  }
</script>
</body>
</html>
